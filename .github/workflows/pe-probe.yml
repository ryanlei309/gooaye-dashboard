# Temporary: test whether Yahoo Finance serves P/E data to GitHub Actions. Manual only; removed after the test.
name: P/E probe (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r build/requirements.txt
      - run: python build/pe_probe.py config/site_config.json
